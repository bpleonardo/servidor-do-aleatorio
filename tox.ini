[flake8]
max_line_length=150
per_file_ignores=__init__.py:F401,F403
statistics=True
max_complexity=10
count=True

# Pylint
[MESSAGES CONTROl]
disable=superfluous-parens,
        invalid-name,
        missing-module-docstring,
        missing-class-docstring,
        missing-function-docstring,
        trailling-comma-tuple,
        too-few-public-methods,
        import-error,
        redefined-builtin

[DESIGN]
max-locals=20
max-returns=10